# English Claw · 每日单词推送
# 每个工作日按北京时间推送 5 个英文单词到 3 个钉钉群
#
# 架构说明：
#   3 个 cron 对应三个群的推送时刻（UTC = 北京 -8h），用 10 分避开整点高负载。
#   代码层自动判断该发哪个群：当前时间已到该群推送时刻且当天没发过的 → 发。
#   去重靠 .sent-flags/ 目录 + GitHub Actions cache 持久化（不 push 文件到 main）。
#
# GitHub Actions 定时任务特性：
#   - 高负载时可能延迟甚至丢弃，不用整点 0 分
#   - 公共仓库 60 天无活动会自动暂停（仓库需定期有提交）
#
# 手动触发：在 GitHub Actions 页面 → Run workflow，可手动测试
# 强制发送：勾选 force_send 并可指定 force_target

name: English Claw Daily Words

on:
  schedule:
    # 3 个 cron，对应三个群的推送时刻（UTC = 北京 -8h）
    # 精简 cron 数量：12 个 cron 可能触发 GitHub 的 schedule 总量限制，
    # 且频繁 push sent-flags 会导致 schedule 反复重新注册。
    # 3 个 cron + 代码层补发逻辑（到点没发过就发）足够覆盖。
    # 用 10 分避开整点高负载。
    - cron: '10 1 * * *'   # 北京 09:10 → LSBG 到点（+补发之前漏的）
    - cron: '10 4 * * *'   # 北京 12:10 → 海外英语到点（+补发之前漏的）
    - cron: '10 9 * * *'   # 北京 17:10 → 海外设计到点（+补发之前漏的）
  # 手动触发（测试用）
  workflow_dispatch:
    inputs:
      force_send:
        description: '强制发送（忽略工作日）'
        type: boolean
        default: true
      force_target:
        description: '只发指定群（留空=全部群）'
        type: string
        default: ''

# 去重：concurrency 按 schedule 表达式分组。
# 同一个 cron 的重复触发会排队（cancel-in-progress: false），不会互相取消。
# 不同 cron 各自独立运行。
concurrency:
  group: english-claw-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

jobs:
  send-words:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore sent-flags cache
        uses: actions/cache@v4
        with:
          path: .sent-flags
          key: sent-flags-${{ github.run_id }}
          restore-keys: |
            sent-flags-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run English Claw
        env:
          TARGETS: ${{ secrets.TARGETS }}
          WORDS_PER_DAY: '5'
          DIVERSITY_DECAY: '0.02'
          SHOW_HINTS: '1'
          FORCE_SEND: ${{ github.event.inputs.force_send || '0' }}
          FORCE_TARGET: ${{ github.event.inputs.force_target || '' }}
        run: python index.py

      - name: Save sent-flags cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .sent-flags
          key: sent-flags-${{ github.run_id }}
