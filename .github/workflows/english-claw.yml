# English Claw · 每日单词推送
# 每个工作日按北京时间推送 5 个英文单词到 3 个钉钉群
#
# 时区说明（重要！）：
#   GitHub Actions cron 使用 UTC 时间。
#   北京时间 = UTC+8，所以北京时间减 8 小时 = UTC 时间。
#   三个群的北京时间推送时刻 → UTC cron：
#     LSBG-OBD海外业务部  北京 09:00 → UTC 01:00 → '0 1 * * *'
#     海外英语能力提升      北京 11:30 → UTC 03:30 → '30 3 * * *'
#     海外设计             北京 17:30 → UTC 09:30 → '30 9 * * *'
#
#   每个 cron 通过 PUSH_TARGET 环境变量指定只发哪个群，
#   不再做时间窗口判断 —— cron 触发即发，简单可靠，不会重复。
#
#   GitHub Actions 定时任务有以下特性：
#   - 最小间隔 5 分钟
#   - 高负载时可能延迟 5-15 分钟
#   - 公共仓库 60 天无活动会自动暂停（所以仓库要定期有提交）
#
# 手动触发：在 GitHub Actions 页面 → Run workflow，可手动测试
# 强制发送：勾选 force_send 并可指定 force_target

name: English Claw Daily Words

on:
  schedule:
    # 每小时非整点触发（UTC 0-11 点 = 北京 08:00-20:00）
    # 关键：不用整点 0 分！GitHub Actions 整点是高负载时段，36% 的 cron 会被丢弃。
    # 用 10 分避开最拥挤的整点窗口。
    # 代码层判断当前该发哪个群，没发过就发，发过了就跳过。
    #
    # 不在 UTC 17-23（北京 01:00-07:00）触发：凌晨不补发（防跨午夜误发）。
    - cron: '10 0 * * *'   # 北京 08:10
    - cron: '10 1 * * *'   # 北京 09:10
    - cron: '10 2 * * *'   # 北京 10:10
    - cron: '10 3 * * *'   # 北京 11:10
    - cron: '10 4 * * *'   # 北京 12:10
    - cron: '10 5 * * *'   # 北京 13:10
    - cron: '10 6 * * *'   # 北京 14:10
    - cron: '10 7 * * *'   # 北京 15:10
    - cron: '10 8 * * *'   # 北京 16:10
    - cron: '10 9 * * *'   # 北京 17:10
    - cron: '10 10 * * *'  # 北京 18:10
    - cron: '10 11 * * *'  # 北京 19:10
  # 手动触发（测试用）
  workflow_dispatch:
    inputs:
      force_send:
        description: '强制发送（忽略工作日）'
        type: boolean
        default: true
      force_target:
        description: '只发指定群（留空=全部群）'
        type: string
        default: ''

# 去重：concurrency 按 schedule 表达式分组。
# 同一个 cron 的重复触发会排队（cancel-in-progress: false），不会互相取消。
# 不同 cron 各自独立运行。
concurrency:
  group: english-claw-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

jobs:
  send-words:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Configure git for push
        run: |
          git config user.name "english-claw-bot"
          git config user.email "actions@github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run English Claw
        env:
          TARGETS: ${{ secrets.TARGETS }}
          WORDS_PER_DAY: '5'
          DIVERSITY_DECAY: '0.02'
          SHOW_HINTS: '1'
          FORCE_SEND: ${{ github.event.inputs.force_send || '0' }}
          FORCE_TARGET: ${{ github.event.inputs.force_target || '' }}
          # GH_PAT 用于 _mark_sent 里的 git push 认证
          GH_PAT: ${{ secrets.GH_PAT }}
          # 不再通过 PUSH_TARGET 指定群名。
          # 代码层自动判断当前时间该发哪个群（已到点但当天没发过的群）。
        run: python index.py
